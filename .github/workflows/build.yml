name: Build release files

on:
  push:
    branches: [release/*, hotfix/*]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest # ARM64
            label: macOS ARM64
            dist-cmd: npx electron-builder --mac zip --arm64 --publish never
            artifact-pattern: "Handbook-*-arm64.zip"
            artifact-name: Handbook-{version}-darwin-arm64.zip
          - os: macos-15-intel # x64
            label: macOS x64
            dist-cmd: npx electron-builder --mac zip --x64 --publish never
            artifact-pattern: "Handbook-*-x64.zip"
            artifact-name: Handbook-{version}-darwin-x64.zip
          - os: ubuntu-latest
            label: Linux deb
            dist-cmd: npx electron-builder --linux deb --publish never
            artifact-pattern: "handbook_*.deb"
            artifact-name: Handbook-{version}-x64-Setup.deb
          - os: ubuntu-latest
            label: Linux rpm
            dist-cmd: npx electron-builder --linux rpm --publish never
            artifact-pattern: "handbook-*.rpm"
            artifact-name: Handbook-{version}-x64-Setup.rpm
          - os: windows-latest
            label: Windows x64
            dist-cmd: npx electron-builder --win nsis --publish never
            artifact-pattern: "Handbook Setup *.exe"
            artifact-name: Handbook-{version}-x64-Setup.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Extract Version from Tag
      id: extract_version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="1.0.0-debug"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
      shell: bash

    - name: Update package.json with Version
      run: |
        node -e "let pkg=require('./package.json'); pkg.version='${{ env.VERSION }}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

    - name: Build
      run: npm run build

    - name: Package ${{ matrix.label }}
      run: ${{ matrix.dist-cmd }}

    - name: Rename Artifact
      run: |
        version=${{ env.VERSION }}
        target="${{ matrix.artifact-name }}"
        target=${target/\{version\}/$version}
        source=$(find release -maxdepth 1 -name "${{ matrix.artifact-pattern }}" | head -1)
        mv "$source" "release/$target"
        echo "RENAMED_TARGET=release/$target" >> $GITHUB_ENV
      shell: bash

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.label }}
        path: ${{ env.RENAMED_TARGET }}
        retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Upload files to GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-nightly') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
