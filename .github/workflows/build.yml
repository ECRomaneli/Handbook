name: Build release files

on:
  push:
    branches: [release/*, hotfix/*]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest # ARM64
            label: macOS-ARM64
            dist-cmd: npx electron-builder --mac zip --arm64 --publish never
          - os: macos-15-intel # x64
            label: macOS-x64
            dist-cmd: npx electron-builder --mac zip --x64 --publish never
          - os: ubuntu-latest
            label: Linux
            dist-cmd: npx electron-builder --linux deb rpm --publish never
          - os: windows-latest
            label: Windows
            dist-cmd: npx electron-builder --win nsis --publish never

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Extract Version from Tag
      id: extract_version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="1.0.0-debug"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
      shell: bash

    - name: Update package.json with Version
      run: |
        node -e "let pkg=require('./package.json'); pkg.version='${{ env.VERSION }}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

    - name: Build
      run: npm run build

    - name: Package ${{ matrix.label }}
      run: ${{ matrix.dist-cmd }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.label }}
        path: |
          release/*.deb
          release/*.rpm
          release/*.exe
          release/*.zip
          release/*.dmg
          release/*.blockmap
          release/latest*.yml
        if-no-files-found: error
        retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Upload files to GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-nightly') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
